name: CI and Deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tools-central-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  DEPLOY_PATH: /opt/tools-central
  PUBLIC_URL: https://www.tools-central.com

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate atomic PR scope
        if: github.event_name == 'pull_request'
        run: npm run pr:validate

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Versions (diagnostic)
        run: |
          node -v
          npm -v
          npx ng version

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint source and templates
        run: npm run lint

      - name: Validate i18n files
        run: npm run i18n:check:strict

      - name: Validate catalog
        run: npm run catalog:validate

      - name: Validate Clean Architecture boundaries
        run: npm run architecture:validate

      - name: Unit tests
        run: npm run test:coverage -- --coverage-reporters=text-summary --coverage-reporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

      - name: Build all localized static pages
        run: npm run build:all

      - name: Validate generated SEO output
        run: npm run seo:validate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Dump Angular errors log on failure
        if: failure()
        run: |
          echo "=== angular-errors.log ==="
          find /tmp -maxdepth 2 -type f -name "angular-errors.log" -print -exec cat {} \; || true

      - name: Package deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          rm -rf deploy
          mkdir -p deploy/site
          cp -r dist/tools-central/browser/. deploy/site/
          cp docker/docker-compose.yml deploy/
          cp docker/nginx.conf deploy/

      - name: Upload deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site
          path: deploy/
          retention-days: 1

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-site
          path: deploy

      - name: Deploy to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy/*"
          target: ${{ env.DEPLOY_PATH }}/releases/${{ github.sha }}
          strip_components: 1
          rm: true

      - name: Start container and verify its health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            deploy_root="${{ env.DEPLOY_PATH }}"
            release="$deploy_root/releases/${{ github.sha }}"
            current="$deploy_root/current"
            previous=""
            previous_is_legacy="false"

            if [ -L "$current" ]; then
              previous=$(readlink -f "$current")
            elif [ -f "$deploy_root/docker-compose.yml" ] && [ -d "$deploy_root/site" ]; then
              previous="$deploy_root"
              previous_is_legacy="true"
            fi

            rollback_release() {
              trap - ERR
              if [ -z "$previous" ] || [ ! -d "$previous" ]; then
                echo "No previous release is available for rollback."
                return 1
              fi

              echo "Rolling back to $previous"
              if [ "$previous_is_legacy" = "true" ]; then
                rm -f "$current" "$deploy_root/current.next"
              else
                ln -sfn "$previous" "$deploy_root/current.next"
                mv -Tf "$deploy_root/current.next" "$current"
              fi
              cd "$previous"
              docker compose --project-name tools-central up -d --remove-orphans --force-recreate
            }

            rollback_on_error() {
              status=$?
              echo "Deployment command failed with status $status."
              rollback_release || true
              exit "$status"
            }

            test -f "$release/docker-compose.yml"
            test -f "$release/nginx.conf"
            test -f "$release/site/fr/index.html"

            ln -sfn "$release" "$deploy_root/current.next"
            mv -Tf "$deploy_root/current.next" "$current"
            trap rollback_on_error ERR
            cd "$current"
            docker compose --project-name tools-central up -d --remove-orphans --force-recreate

            for attempt in $(seq 1 12); do
              status=$(docker inspect --format='{{.State.Health.Status}}' tools-central 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then
                docker compose --project-name tools-central ps
                if docker exec tools-central wget -q --spider http://127.0.0.1/fr/ && \
                   docker exec tools-central wget -q --spider http://127.0.0.1/fr/categories/math/percentages/percentage-of-number; then
                  trap - ERR
                  exit 0
                fi
                echo "Container is healthy but required routes are unavailable."
                break
              fi
              sleep 5
            done

            docker compose --project-name tools-central ps || true
            docker logs --tail 100 tools-central || true
            rollback_release || true
            exit 1

      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "${PUBLIC_URL}/fr/" > /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "${PUBLIC_URL}/fr/categories/math/percentages/percentage-of-number" | grep -q "Pourcentage d’un nombre"
          worker_headers=$(mktemp)
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --dump-header "$worker_headers" --output /dev/null "${PUBLIC_URL}/assets/pdfjs/pdf.worker.min.mjs"
          grep -Eiq '^content-type: (application|text)/javascript' "$worker_headers"
