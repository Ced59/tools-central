server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ------------------------------------------------------------
  # IMPORTANT: empêcher nginx de fabriquer des Location en http://
  # (quand il ajoute un slash, normalise, etc. derrière un proxy)
  # ------------------------------------------------------------
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  # --- assets statiques (cache long) ---
  location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|eot|map)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
    access_log off;
  }

  # --- sitemap / robots ---
  location ~* ^/(?:sitemap\.xml|sitemap-[^/]+\.xml|robots\.txt)$ {
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # --- canonicalize /fr -> /fr/ ---
  location = /fr {
    return 301 /fr/;
  }

  # ------------------------------------------------------------
  # Routes statiques par locale. Toute route absente renvoie la page 404
  # localisée avec un vrai statut HTTP 404 (pas de soft 404 SEO).
  # ------------------------------------------------------------
  location ^~ /fr/      { error_page 404 =404 /fr/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /en/      { error_page 404 =404 /en/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /es/      { error_page 404 =404 /es/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /de/      { error_page 404 =404 /de/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /it/      { error_page 404 =404 /it/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /nl/      { error_page 404 =404 /nl/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /sv/      { error_page 404 =404 /sv/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /da/      { error_page 404 =404 /da/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /no/      { error_page 404 =404 /no/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /fi/      { error_page 404 =404 /fi/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /pl/      { error_page 404 =404 /pl/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /cs/      { error_page 404 =404 /cs/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /sk/      { error_page 404 =404 /sk/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /ro/      { error_page 404 =404 /ro/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /hu/      { error_page 404 =404 /hu/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /tr/      { error_page 404 =404 /tr/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /id/      { error_page 404 =404 /id/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /vi/      { error_page 404 =404 /vi/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /sw/      { error_page 404 =404 /sw/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /af/      { error_page 404 =404 /af/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /fil/     { error_page 404 =404 /fil/404/index.html;     try_files $uri/index.html $uri =404; }
  location ^~ /pt-BR/   { error_page 404 =404 /pt-BR/404/index.html;   try_files $uri/index.html $uri =404; }
  location ^~ /pt-PT/   { error_page 404 =404 /pt-PT/404/index.html;   try_files $uri/index.html $uri =404; }
  location ^~ /ru/      { error_page 404 =404 /ru/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /uk/      { error_page 404 =404 /uk/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /bg/      { error_page 404 =404 /bg/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /el/      { error_page 404 =404 /el/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /ja/      { error_page 404 =404 /ja/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /ko/      { error_page 404 =404 /ko/404/index.html;      try_files $uri/index.html $uri =404; }
  location ^~ /zh-Hans/ { error_page 404 =404 /zh-Hans/404/index.html; try_files $uri/index.html $uri =404; }

  # --- racine du container : fallback fr ---
  location = / {
    return 301 /fr/;
  }

  # --- toute URL hors locale renvoie la 404 française ---
  location / {
    error_page 404 =404 /fr/404/index.html;
    try_files $uri/index.html $uri =404;
  }
}
